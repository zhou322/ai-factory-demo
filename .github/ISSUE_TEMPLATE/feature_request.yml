name: Feature Request
description: 向 AI Factory 流水线提交一个新功能需求，AI 会自动澄清、写 spec、实现、测试、部署
title: "[Feature] "
labels: ["stage:init"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 想要的功能
      description: 用自然语言描述清楚就行，不需要写得像正式需求文档，AI 会帮你整理。
      placeholder: 例如：希望 Todo 支持按 done 状态筛选，并且能给每个 Todo 打标签...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景 / 补充信息（可选）
      description: 有没有相关的约束、参考、优先级？
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我理解这个 issue 会被 AI 自动处理（澄清 -> 写 spec -> 实现 -> 测试 -> 部署），我会在关键节点做 review
          required: true
