name: Claude Chat (interactive @claude mentions)

# This workflow is intentionally outside the init -> plan -> improve ->
# implement -> verify -> deploy state machine. It exists so you can talk to
# Claude ad hoc on any issue or PR -- e.g. "@claude review this PR" or
# "@claude why did this test fail" -- without it trying to advance any
# stage:* label. For the formal pipeline stages, use the documented
# triggers instead (see docs/ai-factory.md): /revise on the spec PR,
# /implement on the issue, etc.
#
# Note: GitHub's own web UI may auto-suggest an "agent mention" picker when
# you type "@" in a comment box (e.g. for GitHub Copilot's coding agent).
# That is unrelated to this workflow and to the Claude GitHub App -- do not
# pick a bracketed suggestion like "@claude[agent]" or "@copilot[model]"
# from that picker. Just type a plain "@claude ..." comment and submit it;
# this workflow matches on the literal text, not on GitHub's agent picker.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >
      contains(github.event.comment.body, '@claude') &&
      !startsWith(github.event.comment.body, '/revise') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
